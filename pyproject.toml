[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aztdp"
version = "0.1.0"
requires-python = ">=3.11"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = [
    "services/django-app",
    "services/gateway",
    "services/anomaly-service",
    "services/telemetry-ingest",
]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
