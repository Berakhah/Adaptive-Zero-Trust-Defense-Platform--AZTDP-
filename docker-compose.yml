networks:
  aztdp:
    driver: bridge
    # Pinned so nginx (the only trusted proxy) has a stable address. Django and
    # Spring trust client-IP/geo headers only from that single address.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  anomaly_models:
  prometheus_data:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aztdp
      POSTGRES_USER: aztdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/db/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ./infra/postgres/03_grants.sql:/docker-entrypoint-initdb.d/03_grants.sql:ro
    networks:
      - aztdp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aztdp -d aztdp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    command: ["sh", "-c", "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - aztdp
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    build: ./infra/keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (see .env.example)}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (see .env.example)}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aztdp
      KC_DB_USERNAME: aztdp
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      # Issuer must match AZTDP_OIDC_ISSUER. Keycloak is not published to the
      # host and is reachable only on the private network, so plain HTTP stays
      # enabled for service-to-service JWKS fetches; external clients would
      # reach it only through a TLS ingress that sets X-Forwarded-*.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://keycloak:8080}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Substituted into the realm import (infra/keycloak/aztdp-realm.json).
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required (see .env.example)}
    command: ["start", "--optimized", "--import-realm"]
    networks:
      - aztdp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; read -r status <&3; case \"$$status\" in *\" 200 \"*) exit 0 ;; *) exit 1 ;; esac' "]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  opa:
    image: openpolicyagent/opa:0.65.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    networks:
      - aztdp
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend Services ─────────────────────────────────────────────────────────

  gateway:
    build: ./services/gateway
    environment:
      AZTDP_OPA_URL: http://opa:8181
      AZTDP_REDIS_URL: redis://:${REDIS_PASSWORD_URLENCODED:?REDIS_PASSWORD_URLENCODED is required (URL-encoded REDIS_PASSWORD)}@redis:6379/0
      AZTDP_TELEMETRY_URL: http://telemetry-ingest:8080
      AZTDP_FAIL_OPEN: "false"
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
      AZTDP_DB_URL: postgresql://aztdp:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required (URL-encoded POSTGRES_PASSWORD)}@postgres:5432/aztdp
    networks:
      - aztdp
    depends_on:
      opa:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  risk-engine:
    build: ./services/risk-engine
    environment:
      AZTDP_REDIS_URL: redis://:${REDIS_PASSWORD_URLENCODED:?REDIS_PASSWORD_URLENCODED is required (URL-encoded REDIS_PASSWORD)}@redis:6379/0
      AZTDP_ANOMALY_URL: http://anomaly-service:8080
      AZTDP_TELEMETRY_URL: http://telemetry-ingest:8080
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
    networks:
      - aztdp
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  anomaly-service:
    build: ./services/anomaly-service
    environment:
      AZTDP_REDIS_URL: redis://:${REDIS_PASSWORD_URLENCODED:?REDIS_PASSWORD_URLENCODED is required (URL-encoded REDIS_PASSWORD)}@redis:6379/0
      AZTDP_DB_URL: postgresql://aztdp:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required (URL-encoded POSTGRES_PASSWORD)}@postgres:5432/aztdp
      AZTDP_MODEL_DIR: /app/models
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
    volumes:
      - anomaly_models:/app/models
    networks:
      - aztdp
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-ingest:
    build: ./services/telemetry-ingest
    environment:
      AZTDP_DB_URL: postgresql://aztdp:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required (URL-encoded POSTGRES_PASSWORD)}@postgres:5432/aztdp
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
    networks:
      - aztdp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  forensics:
    build: ./services/forensics
    environment:
      AZTDP_DB_URL: postgresql://aztdp:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required (URL-encoded POSTGRES_PASSWORD)}@postgres:5432/aztdp
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
    networks:
      - aztdp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ─────────────────────────────────────────────────────

  django-app:
    build: ./services/django-app
    environment:
      AZTDP_SECRET_KEY: ${AZTDP_SECRET_KEY:?AZTDP_SECRET_KEY is required, >=32 random chars (see .env.example)}
      AZTDP_DEBUG: "false"
      AZTDP_ALLOWED_HOSTS: ${AZTDP_ALLOWED_HOSTS:?AZTDP_ALLOWED_HOSTS is required, comma-separated hostnames (see .env.example)}
      AZTDP_TIMEOUT_CONNECT: "1.0"
      AZTDP_DB_HOST: postgres
      AZTDP_DB_NAME: aztdp
      AZTDP_DB_USER: aztdp
      AZTDP_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      AZTDP_DB_PORT: "5432"
      AZTDP_OIDC_ISSUER: http://keycloak:8080/realms/aztdp
      AZTDP_JWKS_URL: http://keycloak:8080/realms/aztdp/protocol/openid-connect/certs
      AZTDP_AUDIENCE: aztdp-api
      AZTDP_RISK_ENGINE_URL: http://risk-engine:8080
      AZTDP_POLICY_GATEWAY_URL: http://gateway:8080
      AZTDP_TOKEN_REVOKE_URL: http://gateway:8080/v1/tokens/revoke
      AZTDP_FAIL_OPEN: "false"
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
      AZTDP_REDIS_URL: redis://:${REDIS_PASSWORD_URLENCODED:?REDIS_PASSWORD_URLENCODED is required (URL-encoded REDIS_PASSWORD)}@redis:6379/0
      AZTDP_STEPUP_SIGNING_KEY: ${AZTDP_STEPUP_SIGNING_KEY:?AZTDP_STEPUP_SIGNING_KEY is required (see .env.example)}
      AZTDP_TOTP_MASTER_SECRET: ${AZTDP_TOTP_MASTER_SECRET:?AZTDP_TOTP_MASTER_SECRET is required (see .env.example)}
      # Only nginx may assert client IP / geo.
      AZTDP_TRUSTED_PROXIES: 172.28.0.10/32
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn aztdp_django.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 30"
    networks:
      - aztdp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
      risk-engine:
        condition: service_healthy

  spring-app:
    build: ./services/spring-app
    environment:
      AZTDP_RISK_ENGINE_URL: http://risk-engine:8080
      AZTDP_POLICY_GATEWAY_URL: http://gateway:8080
      AZTDP_TOKEN_REVOKE_URL: http://gateway:8080/v1/tokens/revoke
      AZTDP_OIDC_ISSUER: http://keycloak:8080/realms/aztdp
      AZTDP_FAIL_OPEN: "false"
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
      AZTDP_TRUSTED_PROXIES: 172.28.0.10/32
    networks:
      - aztdp
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
      risk-engine:
        condition: service_healthy

  # ── TLS Ingress ───────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "3443:3443"
      - "9443:9443"
    networks:
      aztdp:
        ipv4_address: 172.28.0.10
    depends_on:
      - django-app
      - spring-app
      - grafana
      - dashboard
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - aztdp

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/policy-decisions.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aztdp
    depends_on:
      - prometheus

  # ── SOC Dashboard ─────────────────────────────────────────────────────────────

  dashboard:
    build: ./services/dashboard
    environment:
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN:?AZTDP_INTERNAL_TOKEN is required (see .env.example)}
      # Full htpasswd line (user:hash), e.g. `echo "soc:$(openssl passwd -apr1)"`.
      # Single-quote it in .env so the $ characters are not interpolated.
      DASHBOARD_HTPASSWD: ${DASHBOARD_HTPASSWD:?DASHBOARD_HTPASSWD is required, a full htpasswd line (see .env.example)}
    networks:
      - aztdp
    depends_on:
      - forensics
      - gateway
      - risk-engine
      - anomaly-service
      - telemetry-ingest
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8099/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
