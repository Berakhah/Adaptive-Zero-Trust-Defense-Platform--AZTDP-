name: Release

# Runs only on a version tag. Builds every service image, scans it, pushes it to
# GHCR, signs it keylessly with cosign, and publishes a GitHub Release with the
# SBOMs attached. Write permissions are granted here and nowhere else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR
  id-token: write   # keyless cosign signing
  actions: read     # look up the CI result for the tagged commit

env:
  REGISTRY: ghcr.io

jobs:
  # Never publish a build that CI has not passed: the tagged commit must have a
  # successful run of the CI workflow (tag a commit that already merged to main).
  gate:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
                --commit "${{ github.sha }}" --status success --json databaseId \
                --jq 'length')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful CI run for ${{ github.sha }}. Merge via a green PR before tagging."
            exit 1
          fi

  images:
    name: Image (${{ matrix.service }})
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # attack-sim is a dev-only tool and services/dashboard is being replaced
        # (plan Task 18); neither is released.
        service: [gateway, risk-engine, anomaly-service, telemetry-ingest, forensics, django-app, spring-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: |
          # GHCR requires a lowercase repository path.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/aztdp-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Build once into the local daemon so it can be scanned before anything is pushed.
      - name: Build (local)
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Sign
        run: cosign sign --yes "${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" sbom/*.spdx.json \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
