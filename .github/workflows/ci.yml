name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "25"

jobs:

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.5.0
      - run: ruff check services/ --select=E,F,W,I --ignore=E501

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aztdp
          POSTGRES_USER: aztdp
          POSTGRES_PASSWORD: aztdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aztdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.2.2 pytest-django==4.8.0 httpx
          for req in services/*/requirements.txt; do
            pip install -r "$req"
          done
      - name: Run pytest
        env:
          AZTDP_REDIS_URL: redis://localhost:6379/0
          AZTDP_DB_HOST: localhost
          AZTDP_SECRET_KEY: ci-secret
        run: pytest -ra

  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run mvn test
        working-directory: services/spring-app
        run: mvn -B test

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, test-java]
    strategy:
      matrix:
        service:
          - gateway
          - risk-engine
          - anomaly-service
          - telemetry-ingest
          - forensics
          - django-app
          - spring-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: aztdp/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  integration-test:
    name: Integration (compose + attack sim)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Bring up stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health \
               && curl -sf http://localhost:8001/health \
               && curl -sf http://localhost:8002/health; then
              echo "stack ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Run attack sim tests
        env:
          AZTDP_RUN_LIVE_TESTS: "1"
          AZTDP_BASE_URL: http://localhost:8010
          AZTDP_USERNAME: user1
          AZTDP_PASSWORD: password
          AZTDP_KEYCLOAK_TOKEN_URL: http://localhost:8080/realms/aztdp/protocol/openid-connect/token
          AZTDP_CLIENT_ID: aztdp-client
          AZTDP_CLIENT_SECRET: aztdp-secret
        run: |
          pip install pytest==8.2.2 requests
          pytest services/attack-sim/test_attack_outcomes.py -ra
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
