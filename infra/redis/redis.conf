# AZTDP Redis configuration
# The password is NOT set here: docker-compose starts redis-server with
# --requirepass "$REDIS_PASSWORD" (Redis does not expand env vars in this file).
bind 0.0.0.0
port 6379
protected-mode yes

# Durability: AOF + periodic RDB snapshot
appendonly yes
appendfsync everysec
save 300 10

# Never silently evict revocation/risk state; writes fail when full instead
maxmemory 256mb
maxmemory-policy noeviction

loglevel notice
