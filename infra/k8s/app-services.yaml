apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: aztdp
spec:
  replicas: 2
  selector: {matchLabels: {app: telemetry-ingest}}
  template:
    metadata:
      labels: {app: telemetry-ingest}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: telemetry-ingest
          image: aztdp/telemetry-ingest:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: aztdp-config}}]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          livenessProbe:  {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: telemetry-ingest, namespace: aztdp}
spec:
  selector: {app: telemetry-ingest}
  ports: [{port: 8080, targetPort: 8080}]
---
