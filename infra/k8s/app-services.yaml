apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: aztdp
spec:
  replicas: 2
  selector: {matchLabels: {app: django-app}}
  template:
    metadata:
      labels: {app: django-app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: django-app
          image: aztdp/django-app:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: aztdp-config}}]
          env:
            - name: AZTDP_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aztdp-secrets, key: AZTDP_SECRET_KEY}}
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits:   {cpu: "1000m", memory: "512Mi"}
          livenessProbe:  {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 30}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: django-app, namespace: aztdp}
spec:
  selector: {app: django-app}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: aztdp
spec:
  replicas: 2
  selector: {matchLabels: {app: spring-app}}
  template:
    metadata:
      labels: {app: spring-app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8082", prometheus.io/path: "/actuator/prometheus"}
    spec:
      containers:
        - name: spring-app
          image: aztdp/spring-app:latest
          ports: [{containerPort: 8082}]
          envFrom: [{configMapRef: {name: aztdp-config}}]
          resources:
            requests: {cpu: "300m", memory: "512Mi"}
            limits:   {cpu: "1000m", memory: "1Gi"}
          livenessProbe:  {httpGet: {path: /health, port: 8082}, initialDelaySeconds: 60}
          readinessProbe: {httpGet: {path: /health, port: 8082}, initialDelaySeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: spring-app, namespace: aztdp}
spec:
  selector: {app: spring-app}
  ports: [{port: 8082, targetPort: 8082}]
