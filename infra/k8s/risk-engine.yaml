apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: aztdp
  labels: {app: risk-engine}
spec:
  replicas: 2
  selector:
    matchLabels: {app: risk-engine}
  template:
    metadata:
      labels: {app: risk-engine}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: risk-engine
          image: aztdp/risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: aztdp-config}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: aztdp
spec:
  selector: {app: risk-engine}
  ports: [{port: 8080, targetPort: 8080}]
