apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aztdp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: aztdp
            - name: POSTGRES_USER
              value: aztdp
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aztdp-secrets, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aztdp
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aztdp
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aztdp
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: aztdp
spec:
  replicas: 2
  selector:
    matchLabels: {app: opa}
  template:
    metadata:
      labels: {app: opa}
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:0.65.0
          args: ["run", "--server", "--addr", "0.0.0.0:8181"]
          ports: [{containerPort: 8181}]
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: aztdp
spec:
  selector: {app: opa}
  ports: [{port: 8181, targetPort: 8181}]
