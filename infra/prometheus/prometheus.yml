global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: risk-engine
    static_configs:
      - targets: ["risk-engine:8080"]

  - job_name: anomaly-service
    static_configs:
      - targets: ["anomaly-service:8080"]

  - job_name: telemetry-ingest
    static_configs:
      - targets: ["telemetry-ingest:8080"]

  - job_name: forensics
    static_configs:
      - targets: ["forensics:8080"]

  - job_name: django-app
    static_configs:
      - targets: ["django-app:8080"]

  - job_name: spring-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-app:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
