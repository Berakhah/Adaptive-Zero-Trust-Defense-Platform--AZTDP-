{{- range $name, $svc := dict
  "gateway" .Values.services.gateway
  "risk-engine" .Values.services.riskEngine
  "anomaly-service" .Values.services.anomalyService
  "telemetry-ingest" .Values.services.telemetryIngest
  "forensics" .Values.services.forensics
}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app: {{ $name }}}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.port }}"
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef: {name: aztdp-config}
          resources:
{{ toYaml $svc.resources | indent 12 }}
          livenessProbe:
            httpGet: {path: /health, port: {{ $svc.port }}}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health, port: {{ $svc.port }}}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
