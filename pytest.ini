[pytest]
testpaths =
    services/gateway/tests
    services/risk-engine/tests
    services/anomaly-service/tests
    services/telemetry-ingest/tests
    services/forensics/tests
    services/django-app/tests
    services/attack-sim
addopts = -ra --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests that require live services (skipped by default)
    slow: long-running tests
filterwarnings =
    ignore::DeprecationWarning
