# Local development overrides: re-publishes service ports on loopback only,
# runs Keycloak in dev mode with the seeded (password-grant) dev realm, turns
# Django DEBUG on, and defines the attack simulator behind the "sim" profile.
#
# Usage:
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up
#   ... --profile sim up        # also start attack-sim
#
# The base file requires its secrets (${VAR:?}) and Compose evaluates those guards
# before merging overrides, so the dev-only values live in .env.dev (committed,
# public, clearly labeled) and are passed with --env-file. Nothing here is
# usable in production.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  keycloak:
    environment:
      # Dev mode derives the issuer from the request host; no fixed hostname.
      KC_HOSTNAME: !reset null
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    volumes:
      # Dev realm (seeded users, password grant, wildcard redirects): never in prod.
      - ./infra/keycloak/aztdp-realm.dev.json:/opt/keycloak/data/import/aztdp-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
  opa:
    ports:
      - "127.0.0.1:8181:8181"
  gateway:
    ports:
      - "127.0.0.1:8000:8080"
  risk-engine:
    ports:
      - "127.0.0.1:8001:8080"
  anomaly-service:
    ports:
      - "127.0.0.1:8002:8080"
  telemetry-ingest:
    ports:
      - "127.0.0.1:8003:8080"
  forensics:
    ports:
      - "127.0.0.1:8004:8080"
  django-app:
    environment:
      AZTDP_DEBUG: "true"
      # Dev only: the published port below bypasses nginx, so a client on the host
      # reaches Django from the bridge gateway. Trust the whole bridge subnet so
      # X-Client-Ip / X-Geo from the attack simulator and live tests are honoured
      # (the production file trusts only nginx, 172.28.0.10/32).
      AZTDP_TRUSTED_PROXIES: 172.28.0.0/16
    ports:
      - "127.0.0.1:8010:8000"
  django-migrate:
    environment:
      AZTDP_DEBUG: "true"
  spring-app:
    ports:
      - "127.0.0.1:8011:8082"
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
  # Attack simulator: dev only, started with `--profile sim`.
  attack-sim:
    profiles: ["sim"]
    build: ./services/attack-sim
    environment:
      AZTDP_BASE_URL: http://django-app:8000
      AZTDP_KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/aztdp/protocol/openid-connect/token
      AZTDP_CLIENT_ID: aztdp-client
      AZTDP_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Seeded users from aztdp-realm.dev.json (dev realm only).
      AZTDP_USERNAME: risk_user
      AZTDP_PASSWORD: password
      AZTDP_ATTACK_USERNAME: user1
      AZTDP_ATTACK_PASSWORD: password
      AZTDP_PASSWORD_LIST: wrong1,wrong2,wrong3,password
      AZTDP_INTERNAL_TOKEN: ${AZTDP_INTERNAL_TOKEN}
      AZTDP_SIM_ORIGINS: http://localhost:8099,https://localhost:9443
      AZTDP_REQUEST_DELAY_MS: "200"
    networks:
      - aztdp
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8090:8090"
  dashboard:
    ports:
      - "127.0.0.1:8099:8099"
